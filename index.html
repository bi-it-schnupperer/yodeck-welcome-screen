<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>yodeck-welcome-screen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template CSS -->
    <link href="css/template.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* Verfügbare Farben */

        /* Die Farbe einsetzen:
           z.B: background: var(--blue);
        */

        :root {
            /* Base */
            --light: #e6e6e6;
            --dark: #212529;

            /* Primary Colors */
            --blue: #7dbfd4;
            --green: #9adaa9;
            --cyan: #6ed0df;
            --yellow: #f0e266;
            --red: #d17b78;

            /* Additional Colors */
            --purple: #8171bb;
            --pink: #d96ee7;
            --orange-dark: #e0b068;
            --teal: #50a78d;
            --lime: #a9d468;
        }

        .welcome-card {
            /* Hintergrundfarbe */
            background: #ca3611;

            /* Textfarbe */
            color: #000000;

            margin: left 50px;
        }

        h1 {
            /* Titel: Schriftgrösse */
            font-size: 50px;

            /* Titel: Schriftstärke */
            font-weight: 600;
        }

        .name {
            /* Schriftgrösse */
            font-size: 50px;

            /* Schriftstärke */
            font-weight: 600;

            /* Farbe */
            color: rgb(255, 204, 0);
        }
    </style>
</head>

<body>

    <!-- Logo oben rechts -->
    <img src="img/logo.png" class="logo-top-right" width="180" alt="Logo">

    <div class="container-fluid screen fade-in">

        <!-- LINKE SEITE: 4 flache, aber breitere Boxen untereinander -->
        <div class="left-column">

            <!-- Box 1 -->
            <div class="welcome-card">
                <div class="icon">
                    <i class="bi bi-clock"></i>
                </div>
                <h1>08:00 Uhr</h1>
                <div class="subtitle">
                    Begrüssung & Rundgang durch das Gebäude
                </div>
            </div>

            <!-- Box 2 -->
            <div class="welcome-card">
                <div class="icon">
                    <i class="bi bi-laptop"></i>
                </div>
                <h1>09:30 Uhr</h1>
                <div class="subtitle">
                    Einführung in unsere internen Systeme
                </div>
            </div>

            <!-- Box 3 -->
            <div class="welcome-card">
                <div class="icon">
                    <i class="bi bi-cup-hot"></i>
                </div>
                <h1>12:00 Uhr</h1>
                <div class="subtitle">
                    Gemeinsames Mittagessen im Team
                </div>
            </div>

            <!-- Box 4 -->
            <div class="welcome-card">
                <div class="icon">
                    <i class="bi bi-chat-dots"></i>
                </div>
                <h1>15:00 Uhr</h1>
                <div class="subtitle">
                    Feedbackgespräch & Abschluss des Tages
                </div>
            </div>

        </div>

        <!-- RECHTE SEITE: Deine grosse Willkommens-Box -->
        <div class="welcome-card right-box">

            <div class="icon">
                <i class="bi bi-person"></i>
            </div>

            <h1>Herzlich Willkommen in der ESPAS</h1>

            <div class="name">
                Louis Tschopp
            </div>

            <div class="subtitle">
                Schön, dass du heute als Schnupperer bei uns bist.
            </div>

        </div>

    </div>

</body>

</html>
