name: Deploy to GitHub Pages

on: push

jobs:
  deploy:
    name: Deploy to GitHub Pages

    permissions:
      pages: write
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: /

      - name: Deploy
        uses: actions/deploy-pages@v4
