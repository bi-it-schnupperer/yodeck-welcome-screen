name: Deploy to GitHub Pages

on: push

jobs:
  deploy:
    name: Deploy to GitHub Pages

    permissions:
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Upload Build Artifact
        id: build
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
